name: Publish Mystoica Reading

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Generate reading
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_reading.py

      - name: Commit and push
        run: |
          git config user.name "mystoica-bot"
          git config user.email "actions@github.com"
          git add readings/ index.html archive.html
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Automated reading: $(date -u +%Y-%m-%d)"
          git push
